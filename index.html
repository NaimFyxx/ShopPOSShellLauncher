<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#16141a">
  <title>Fyxx — POS Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ── TOKENS ───────────────────────────────────────────── */
    :root {
      --bg:           #16141a;
      --surface:      #1c1920;
      --surface-hi:   #232030;
      --gold:         #c9a84c;
      --gold-light:   #dfc06a;
      --gold-dim:     rgba(201,168,76,0.15);
      --gold-border:  rgba(201,168,76,0.30);
      --text:         #f0ebe0;
      --text-sub:     #8a8090;
      --danger:       #c94c5a;
      --overlay:      rgba(10,8,14,0.94);
      --radius-tile:  20px;
      --radius-btn:   12px;
      --easing:       cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Raleway', 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Ambient top glow */
    body::before {
      content: '';
      position: fixed;
      top: -30vh;
      left: 50%;
      transform: translateX(-50%);
      width: 70vw;
      height: 70vw;
      background: radial-gradient(circle, rgba(201,168,76,0.05) 0%, transparent 65%);
      pointer-events: none;
    }

    /* ── HEADER ───────────────────────────────────────────── */
    .header {
      flex: 0 0 22vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1.5rem 2rem 1rem;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-border), transparent);
    }

    /* The wordmark is the triple-tap admin trigger */
    .wordmark {
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-size: clamp(3rem, 7.5vw, 5.5rem);
      font-weight: 300;
      letter-spacing: 0.45em;
      color: var(--gold-light);
      line-height: 1;
      cursor: default;
      padding: 0.25em 0.5em;       /* generous hit area for triple-tap */
      touch-action: manipulation;
    }

    .tagline {
      font-size: clamp(0.65rem, 1.4vw, 0.85rem);
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-sub);
    }

    /* ── MAIN — TILE GRID ─────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2vh 6vw;
      gap: 3vw;
    }

    /* ── TILES ────────────────────────────────────────────── */
    .tile {
      flex: 1;
      min-width: 240px;
      max-width: 44vw;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      padding: clamp(1.5rem, 3vh, 2.5rem) clamp(1.5rem, 3vw, 2.5rem);
      background: var(--surface);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-tile);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition:
        background 180ms var(--easing),
        border-color 180ms var(--easing),
        transform 150ms var(--easing),
        box-shadow 180ms var(--easing);
      touch-action: manipulation;
    }

    /* Glow overlay — appears on press */
    .tile::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% -10%, var(--gold-dim) 0%, transparent 65%);
      opacity: 0;
      transition: opacity 180ms ease;
      pointer-events: none;
    }

    .tile.pressed,
    .tile:active {
      background: var(--surface-hi);
      border-color: var(--gold);
      transform: scale(0.968);
      box-shadow:
        0 0 0 2px var(--gold-dim),
        0 20px 60px rgba(0,0,0,0.45);
    }

    .tile.pressed::after,
    .tile:active::after {
      opacity: 1;
    }

    .tile.launching {
      pointer-events: none;
      border-color: rgba(201,168,76,0.5);
    }

    /* ── TILE ICON ────────────────────────────────────────── */
    .tile-icon {
      width: clamp(60px, 7.5vw, 90px);
      height: clamp(60px, 7.5vw, 90px);
      color: var(--gold);
      flex-shrink: 0;
      transition: color 180ms ease;
      position: relative;
    }

    .tile-icon svg {
      width: 100%;
      height: 100%;
    }

    .tile.pressing .tile-icon {
      color: var(--gold-light);
    }

    /* ── SPINNER (shown while launching) ──────────────────── */
    .tile-spinner {
      display: none;
      width: clamp(28px, 3.5vw, 40px);
      height: clamp(28px, 3.5vw, 40px);
      border: 2px solid var(--gold-border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      flex-shrink: 0;
    }

    .tile.launching .tile-spinner { display: block; }
    .tile.launching .tile-icon    { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── TILE TEXT ────────────────────────────────────────── */
    .tile-label {
      font-size: clamp(1.1rem, 2.4vw, 1.65rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
      text-align: center;
    }

    .tile-sub {
      font-size: clamp(0.7rem, 1.3vw, 0.9rem);
      font-weight: 300;
      letter-spacing: 0.1em;
      color: var(--text-sub);
      text-align: center;
      text-transform: uppercase;
    }

    /* ── FOOTER ───────────────────────────────────────────── */
    .footer {
      flex: 0 0 14vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      position: relative;
    }

    .footer::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-border), transparent);
    }

    .clock {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.6rem, 3.5vw, 2.6rem);
      font-weight: 300;
      color: var(--text-sub);
      letter-spacing: 0.12em;
    }

    .date-str {
      font-size: clamp(0.6rem, 1.1vw, 0.78rem);
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-sub);
      opacity: 0.55;
    }

    /* ── TOAST NOTIFICATIONS ──────────────────────────────── */
    #toast-container {
      position: fixed;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast {
      padding: 0.8rem 1.8rem;
      border-radius: 100px;
      font-size: clamp(0.8rem, 1.5vw, 0.9rem);
      font-weight: 500;
      letter-spacing: 0.04em;
      animation: toastIn 0.2s ease forwards, toastOut 0.25s ease 2.75s forwards;
    }

    .toast.info  {
      background: rgba(40, 36, 55, 0.97);
      border: 1px solid var(--gold-border);
      color: var(--text);
    }
    .toast.error {
      background: rgba(70, 18, 28, 0.97);
      border: 1px solid rgba(201,76,90,0.45);
      color: #f08090;
    }
    .toast.success {
      background: rgba(18, 55, 35, 0.97);
      border: 1px solid rgba(76,180,110,0.45);
      color: #80d0a0;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }
    @keyframes toastOut {
      from { opacity: 1; }
      to   { opacity: 0; transform: translateY(-6px); }
    }

    /* ── ADMIN OVERLAY ────────────────────────────────────── */
    #admin-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    #admin-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    .admin-modal {
      background: var(--surface);
      border: 1px solid var(--gold-border);
      border-radius: 24px;
      padding: clamp(1.8rem, 4vh, 2.8rem) clamp(2rem, 5vw, 3.2rem);
      width: min(500px, 88vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      box-shadow: 0 40px 100px rgba(0,0,0,0.65);
      position: relative;
    }

    .admin-modal::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-border), transparent);
    }

    .admin-modal h2 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.6rem, 3.5vw, 2rem);
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--text);
    }

    .admin-modal p {
      font-size: clamp(0.75rem, 1.5vw, 0.88rem);
      font-weight: 300;
      color: var(--text-sub);
      text-align: center;
      line-height: 1.65;
    }

    #admin-pw {
      width: 100%;
      padding: 1rem 1.25rem;
      background: var(--bg);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-btn);
      color: var(--text);
      font-family: 'Raleway', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.18em;
      outline: none;
      transition: border-color 0.15s;
      touch-action: manipulation;
      min-height: 58px;
      -webkit-appearance: none;
    }

    #admin-pw:focus       { border-color: var(--gold); }
    #admin-pw.input-error { border-color: var(--danger); animation: shake 0.35s ease; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-8px); }
      50%     { transform: translateX(8px); }
      75%     { transform: translateX(-5px); }
    }

    .modal-error {
      font-size: 0.8rem;
      font-weight: 400;
      min-height: 1.1em;
      text-align: center;
    }

    .admin-buttons {
      display: flex;
      gap: 0.85rem;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 1rem;
      border: none;
      border-radius: var(--radius-btn);
      font-family: 'Raleway', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      min-height: 58px;
      transition: transform 130ms var(--easing), background 150ms ease;
      touch-action: manipulation;
    }

    .btn:active:not(:disabled) { transform: scale(0.96); }

    .btn-cancel {
      background: rgba(255,255,255,0.06);
      color: var(--text-sub);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn-cancel:active { background: rgba(255,255,255,0.1); }

    .btn-exit {
      background: var(--gold);
      color: #0e0c12;
    }
    .btn-exit:active:not(:disabled) { background: var(--gold-light); }
    .btn-exit:disabled {
      background: rgba(201,168,76,0.3);
      color: rgba(14,12,18,0.5);
      cursor: default;
    }
  </style>
</head>
<body>

  <!-- ── HEADER ─────────────────────────────────────────── -->
  <header class="header">
    <div class="wordmark" id="logo" role="button" aria-label="Fyxx — triple-tap for admin">FYXX</div>
    <div class="tagline">Wine &amp; Spirits &nbsp;·&nbsp; Amman</div>
  </header>

  <!-- ── TILE GRID ──────────────────────────────────────── -->
  <main class="main">

    <!-- Odoo POS tile -->
    <div class="tile" id="tile-odoo" role="button" aria-label="Launch Odoo Point of Sale">
      <div class="tile-icon" aria-hidden="true">
        <!-- POS terminal / receipt icon -->
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="10" width="36" height="28" rx="3.5"/>
          <rect x="12" y="17" width="10" height="8" rx="1.5"/>
          <line x1="26" y1="19" x2="36" y2="19"/>
          <line x1="26" y1="23" x2="36" y2="23"/>
          <line x1="12" y1="31" x2="36" y2="31"/>
          <rect x="16" y="38" width="16" height="4" rx="2"/>
          <line x1="9"  y1="38" x2="16" y2="38"/>
          <line x1="32" y1="38" x2="39" y2="38"/>
        </svg>
      </div>
      <div class="tile-spinner" aria-hidden="true"></div>
      <div class="tile-label">Odoo POS</div>
      <div class="tile-sub">Point of Sale</div>
    </div>

    <!-- By The Glass tile -->
    <div class="tile" id="tile-btg" role="button" aria-label="Launch By The Glass">
      <div class="tile-icon" aria-hidden="true">
        <!-- Wine glass icon -->
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 6 H34 L30 22 A8 8 0 0 1 18 22 Z"/>
          <line x1="24" y1="30" x2="24" y2="42"/>
          <line x1="15" y1="42" x2="33" y2="42"/>
          <path d="M17.5 17 Q24 20.5 30.5 17" opacity="0.45"/>
        </svg>
      </div>
      <div class="tile-spinner" aria-hidden="true"></div>
      <div class="tile-label">By The Glass</div>
      <div class="tile-sub">Inventory &amp; Management</div>
    </div>

  </main>

  <!-- ── FOOTER ─────────────────────────────────────────── -->
  <footer class="footer">
    <div class="clock"    id="clock">--:--</div>
    <div class="date-str" id="date-str"></div>
  </footer>

  <!-- ── TOAST CONTAINER ────────────────────────────────── -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- ── ADMIN OVERLAY ──────────────────────────────────── -->
  <div id="admin-overlay" role="dialog" aria-modal="true" aria-label="Admin exit">
    <div class="admin-modal">
      <h2>Admin Exit</h2>
      <p>Enter the admin password to shut down the kiosk<br>and return to the Windows desktop.</p>
      <input type="password" id="admin-pw"
             placeholder="Password"
             autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false">
      <div class="modal-error" id="modal-error" aria-live="polite"></div>
      <div class="admin-buttons">
        <button class="btn btn-cancel" id="btn-cancel">Cancel</button>
        <button class="btn btn-exit"   id="btn-exit">Exit Kiosk</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    // ── CLOCK ─────────────────────────────────────────────
    (function () {
      const clockEl  = document.getElementById('clock');
      const dateEl   = document.getElementById('date-str');
      const DAYS     = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const MONTHS   = ['January','February','March','April','May','June',
                        'July','August','September','October','November','December'];

      function tick() {
        const now = new Date();
        const h   = String(now.getHours()).padStart(2, '0');
        const m   = String(now.getMinutes()).padStart(2, '0');
        clockEl.textContent = `${h}:${m}`;
        dateEl.textContent  =
          `${DAYS[now.getDay()]}  ·  ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
      }

      tick();
      setInterval(tick, 15000);
    })();

    // ── TOAST ─────────────────────────────────────────────
    function showToast(message, type) {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className   = 'toast ' + (type || 'info');
      el.textContent = message;
      container.appendChild(el);
      setTimeout(function () { el.remove(); }, 3200);
    }

    // ── TILE LAUNCH ───────────────────────────────────────
    async function launchApp(endpoint, label, tileEl) {
      if (tileEl.classList.contains('launching')) return;
      tileEl.classList.add('launching');
      showToast('Launching ' + label + '…', 'info');
      try {
        const res  = await fetch(endpoint, { method: 'POST' });
        const data = await res.json();
        if (!data.success) {
          showToast(data.error || 'Failed to launch. Check launcher.log.', 'error');
        }
      } catch (e) {
        showToast('Server not responding — restart start.bat', 'error');
      } finally {
        setTimeout(function () { tileEl.classList.remove('launching'); }, 900);
      }
    }

    // Bind a tile using pointer events (works for touch + mouse)
    function bindTile(id, endpoint, label) {
      const el = document.getElementById(id);
      let active = false;

      el.addEventListener('pointerdown', function () {
        active = true;
        el.classList.add('pressed');
      });

      el.addEventListener('pointerup', function () {
        el.classList.remove('pressed');
        if (active) launchApp(endpoint, label, el);
        active = false;
      });

      el.addEventListener('pointercancel', function () {
        el.classList.remove('pressed');
        active = false;
      });

      el.addEventListener('pointerleave', function () {
        el.classList.remove('pressed');
        active = false;
      });
    }

    bindTile('tile-odoo', '/launch/odoo', 'Odoo POS');
    bindTile('tile-btg',  '/launch/btg',  'By The Glass');

    // ── TRIPLE-TAP ADMIN ──────────────────────────────────
    (function () {
      const logo    = document.getElementById('logo');
      const overlay = document.getElementById('admin-overlay');
      const pwInput = document.getElementById('admin-pw');
      const errEl   = document.getElementById('modal-error');
      const btnExit = document.getElementById('btn-exit');
      const btnCan  = document.getElementById('btn-cancel');

      let tapCount = 0;
      let tapTimer = null;

      function recordTap() {
        tapCount++;
        clearTimeout(tapTimer);
        if (tapCount >= 3) {
          tapCount = 0;
          openModal();
        } else {
          tapTimer = setTimeout(function () { tapCount = 0; }, 1800);
        }
      }

      // Use both touchstart and click so it works on touch + mouse (for testing)
      logo.addEventListener('touchstart', function (e) {
        e.preventDefault();   // prevents the 300ms ghost click
        recordTap();
      }, { passive: false });

      logo.addEventListener('click', recordTap);

      // ── Modal lifecycle ──────────────────────────────────
      function openModal() {
        errEl.textContent  = '';
        errEl.style.color  = '';
        pwInput.value      = '';
        btnExit.disabled   = false;
        overlay.classList.add('visible');
        setTimeout(function () { pwInput.focus(); }, 120);
      }

      function closeModal() {
        overlay.classList.remove('visible');
        pwInput.value     = '';
        errEl.textContent = '';
        errEl.style.color = '';
      }

      // Close on backdrop tap
      overlay.addEventListener('pointerdown', function (e) {
        if (e.target === overlay) closeModal();
      });

      // Cancel button
      btnCan.addEventListener('pointerup', function (e) {
        e.stopPropagation();
        closeModal();
      });

      // ── Exit submission ──────────────────────────────────
      async function tryExit() {
        const pw = pwInput.value;
        if (!pw) {
          errEl.style.color  = 'var(--danger)';
          errEl.textContent  = 'Please enter the admin password.';
          return;
        }

        btnExit.disabled  = true;
        errEl.textContent = '';

        try {
          const res  = await fetch('/admin/exit', {
            method:    'POST',
            headers:   { 'Content-Type': 'application/json' },
            body:      JSON.stringify({ password: pw }),
            keepalive: true
          });
          const data = await res.json().catch(function () { return { success: true }; });

          if (data.success) {
            errEl.style.color = '#5cc990';
            errEl.textContent = 'Shutting down kiosk…';
          } else {
            errEl.style.color = 'var(--danger)';
            errEl.textContent = data.error || 'Incorrect password.';
            pwInput.classList.add('input-error');
            setTimeout(function () { pwInput.classList.remove('input-error'); }, 400);
            btnExit.disabled = false;
          }
        } catch (fetchErr) {
          // Chrome being killed causes fetch to throw — that is the success path.
          errEl.style.color = '#5cc990';
          errEl.textContent = 'Kiosk shutting down…';
        }
      }

      btnExit.addEventListener('pointerup', function (e) {
        e.stopPropagation();
        tryExit();
      });

      pwInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter')  tryExit();
        if (e.key === 'Escape') closeModal();
      });
    })();
  </script>

</body>
</html>
